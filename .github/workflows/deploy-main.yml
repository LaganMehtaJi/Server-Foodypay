name: Deploy Backend - Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Secrets
        run: |
          echo "Checking required secrets..."

          [ -n "${{ secrets.EC2_HOST }}" ] && echo "✅ EC2_HOST found" || (echo "❌ EC2_HOST missing" && exit 1)
          [ -n "${{ secrets.EC2_USER }}" ] && echo "✅ EC2_USER found" || (echo "❌ EC2_USER missing" && exit 1)
          [ -n "${{ secrets.EC2_SSH_KEY }}" ] && echo "✅ EC2_SSH_KEY found" || (echo "❌ EC2_SSH_KEY missing" && exit 1)
          [ -n "${{ secrets.ENV_FILE }}" ] && echo "✅ ENV_FILE found" || (echo "❌ ENV_FILE missing" && exit 1)

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

          echo "SSH setup completed."

      - name: Deploy to Production EC2
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

        run: |
          echo "🚀 Deploying Production..."

          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -ex

            echo "Current user:"
            whoami

            cd /home/ec2-user/backend/blogserver-backhend

            echo "Fetching latest code..."
            git fetch origin

            echo "Switching to main..."
            git checkout main

            echo "Resetting to origin/main..."
            git reset --hard origin/main

            echo "Writing .env..."
            printf "%s" "$ENV_FILE" > .env

            echo "Installing dependencies..."
            npm install

            echo "Reloading PM2..."
            pm2 reload backend

            echo "✅ Production deployment completed!"
          EOF