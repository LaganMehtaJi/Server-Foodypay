name: Deploy Backend to EC2 - Stage

on:
  push:
    branches:
      - stage

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Stage Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_STAGE }}
          EC2_USER: ${{ secrets.EC2_USER_STAGE }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY_STAGE }}
          ENV_FILE: ${{ secrets.ENV_FILE_STAGE }}
        run: |
          set -e

          [ -n "$EC2_HOST" ] || { echo "EC2_HOST missing"; exit 1; }
          [ -n "$EC2_USER" ] || { echo "EC2_USER missing"; exit 1; }
          [ -n "$EC2_SSH_KEY" ] || { echo "EC2_SSH_KEY missing"; exit 1; }
          [ -n "$ENV_FILE" ] || { echo "ENV_FILE_STAGE missing"; exit 1; }

          echo "All required secrets available."

      - name: Setup SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_STAGE }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY_STAGE }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create ENV File
        env:
          ENV_FILE: ${{ secrets.ENV_FILE_STAGE }}
        run: |
          printf '%s' "$ENV_FILE" > .env
          chmod 600 .env

      - name: Upload ENV File
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_STAGE }}
          EC2_USER: ${{ secrets.EC2_USER_STAGE }}
        run: |
          scp -i ~/.ssh/id_rsa \
            .env \
            "$EC2_USER@$EC2_HOST:/home/ec2-user/backend/Server-Foodypay/.env"

      - name: Deploy Backend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_STAGE }}
          EC2_USER: ${{ secrets.EC2_USER_STAGE }}
        run: |
          ssh -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd /home/ec2-user/backend/Server-Foodypay

            echo "Fetching latest code..."
            git fetch origin stage

            echo "Updating stage branch..."
            git reset --hard origin/stage

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            echo "Reloading PM2..."
            pm2 reload backend --update-env

            echo "Saving PM2 configuration..."
            pm2 save

            echo "Deployment completed successfully."
          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f .env ~/.ssh/id_rsa