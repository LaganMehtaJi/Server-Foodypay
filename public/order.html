<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Customer Table Order · FoodyPay</title>
  <link rel="icon" type="image/x-icon" href="Logo.ico">
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="apple-touch-icon" href="Logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pri: #ea580c;
      --pri-dark: #c2410c;
      --pri-light: #fff4ed;
      --bg: #090d16;
      --card-bg: #151d2f;
      --border: #26334d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --veg: #22c55e;
      --nonveg: #ef4444;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(75px + var(--safe-bottom));
      user-select: none;
    }

    /* APP DOWNLOAD BANNER (10-SEC REAPPEAR RULE) */
    .app-download-bar {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-bottom: 1.5px solid rgba(234, 88, 12, 0.4);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 60;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .app-download-bar.hiding {
      transform: translateY(-100%);
      opacity: 0;
    }
    .app-dl-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .app-dl-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #94a3b8;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .app-dl-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .app-dl-title {
      font-size: 12.5px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-dl-tag {
      background: #22c55e;
      color: #000;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .app-dl-desc {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-app-install {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(234,88,12,0.4);
    }

    /* RESTAURANT HEADER */
    header {
      background: #111827;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .table-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(234, 88, 12, 0.18);
      border: 1px solid rgba(234, 88, 12, 0.4);
      color: #fb923c;
      font-size: 11.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .btn-call-waiter {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* SEARCH & CATEGORIES */
    .nav-bar {
      position: sticky;
      top: 48px;
      z-index: 40;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
    }
    .search-input-wrap {
      position: relative;
      margin-bottom: 8px;
    }
    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px 8px 34px;
      color: #fff;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
    }
    .cat-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex-shrink: 0;
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cat-chip.active {
      background: #ea580c;
      border-color: #ea580c;
      color: #fff;
    }

    /* DISHES GRID */
    .catalog-container {
      padding: 12px;
      flex: 1;
    }
    .dishes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    @media(min-width: 600px) {
      .dishes-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    }
    .dish-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .dish-card-img-wrap {
      height: 115px;
      width: 100%;
      background: #090d16;
      position: relative;
      overflow: hidden;
    }
    .dish-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .diet-dot {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .diet-dot.veg::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
    }
    .diet-dot.nonveg::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dc2626;
    }
    .dish-body {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .dish-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 2px;
      line-height: 1.25;
    }
    .dish-cat-name {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .dish-variants {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: auto;
    }
    .var-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .var-name {
      font-size: 11.5px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .var-price {
      font-size: 12px;
      font-weight: 800;
      color: #fb923c;
    }
    .btn-add-var {
      background: #ea580c;
      color: #fff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .qty-counter {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-qty {
      background: #334155;
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .qty-val {
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      min-width: 14px;
      text-align: center;
    }

    /* BOTTOM CART BAR */
    .bottom-cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 10px 14px calc(10px + var(--safe-bottom));
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    .bottom-cart-bar.on {
      display: flex;
    }
    .cart-summary {
      display: flex;
      flex-direction: column;
    }
    .cart-tbl-badge {
      font-size: 11px;
      font-weight: 800;
      color: #ea580c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cart-total-text {
      font-size: 18px;
      font-weight: 900;
      color: #fff;
    }
    .btn-place-order {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.4);
    }

    /* MODALS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.on {
      display: flex;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      color: #fff;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
    }
    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- APP DOWNLOAD BANNER (10-SEC DISMISS REAPPEAR TIMER) -->
  <div class="app-download-bar" id="appDownloadBanner">
    <div class="app-dl-left">
      <button class="app-dl-close" onclick="dismissAppBanner()" title="Close banner" aria-label="Dismiss">✕</button>
      <img src="Logo.png" alt="App Logo" class="app-dl-logo" onerror="this.src='https://api.foodypay.online/Logo.png'">
      <div style="min-width:0">
        <div class="app-dl-title" id="appDlTitle">
          <span id="appDlName">FoodyPay App</span>
          <span class="app-dl-tag">FREE</span>
        </div>
        <div class="app-dl-desc">Fast ordering, live tracking &amp; bill</div>
      </div>
    </div>
    <button class="btn-app-install" onclick="handleAppInstall()">Install App</button>
  </div>

  <!-- RESTAURANT & TABLE HEADER -->
  <header>
    <div class="brand-wrap">
      <img src="Logo.png" alt="Logo" class="brand-logo" onerror="this.src='https://api.foodypay.online/Logo.png'">
      <div style="min-width:0">
        <div class="brand-name" id="hdrStoreName">Snack Rack</div>
        <div class="table-badge">
          <span>🍽️</span>
          <span id="hdrTableBadge">Table 01</span>
        </div>
      </div>
    </div>

    <button class="btn-call-waiter" onclick="callWaiterAlert()">
      <span>🔔</span>
      <span>Call Waiter</span>
    </button>
  </header>

  <!-- SEARCH & CATEGORIES -->
  <div class="nav-bar">
    <div class="search-input-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="menuSearch" class="search-input" placeholder="Search dishes, drinks, momos..." oninput="handleSearch(this.value)">
    </div>
    <div class="cat-scroll" id="catScroll">
      <button class="cat-chip active" onclick="filterCat('All')">All Items</button>
    </div>
  </div>

  <!-- DISHES GRID -->
  <div class="catalog-container">
    <div class="dishes-grid" id="dishesGrid">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">
        ⏳ Loading digital menu...
      </div>
    </div>
  </div>

  <!-- BOTTOM STICKY CART BAR -->
  <div class="bottom-cart-bar" id="bottomCartBar">
    <div class="cart-summary" onclick="openCheckoutModal()">
      <div class="cart-tbl-badge" id="cartTableBadge">TABLE 01 · 0 ITEMS</div>
      <div class="cart-total-text" id="cartTotalText">₹0</div>
    </div>
    <button class="btn-place-order" onclick="openCheckoutModal()">
      <span>View Order</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- CHECKOUT & ORDER REVIEW MODAL -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Review Table Order</h3>
        <button class="btn-close" onclick="closeCheckoutModal()">✕</button>
      </div>
      <div style="font-size:12px;color:#fb923c;font-weight:800;margin-bottom:10px" id="reviewTableHeading">TABLE 01</div>
      
      <div style="flex:1;overflow-y:auto;max-height:36vh;margin-bottom:12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 0" id="cartItemsList"></div>

      <div style="margin-bottom:8px">
        <label style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:3px">Your Name (Optional):</label>
        <input id="custName" placeholder="e.g. Rahul, Priya..." style="width:100%;padding:8px 10px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:12px;outline:none">
      </div>

      <div style="margin-bottom:12px">
        <label style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:3px">Cooking Instructions / Note:</label>
        <input id="orderNote" placeholder="e.g. Less spicy, extra sauce..." style="width:100%;padding:8px 10px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:12px;outline:none">
      </div>

      <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:900;margin-bottom:14px">
        <span>Total Amount (Inc. GST):</span>
        <span style="color:#22c55e" id="reviewTotalAmount">₹0</span>
      </div>

      <button id="btnSubmitOrder" onclick="submitCustomerOrder()" style="width:100%;background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;border:none;padding:12px;border-radius:12px;font-size:14.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
        <span>Send Order to Kitchen</span>
      </button>
    </div>
  </div>

  <script>
    // URL Params & Path Parser: /client/:merchantId/:table or /order/:merchantId/:table
    const pathParts = window.location.pathname.replace(/^\/+|\/+$/g, '').split('/');
    let pathMerchant = '';
    let pathTable = '';
    const firstSegment = (pathParts[0] || '').toLowerCase();
    if (pathParts.length >= 2 && (firstSegment === 'client' || firstSegment === 'order' || firstSegment === 'table-order')) {
      if (pathParts[1] && !pathParts[1].endsWith('.html')) {
        pathMerchant = decodeURIComponent(pathParts[1]);
      }
      if (pathParts[2]) {
        pathTable = decodeURIComponent(pathParts[2]);
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const merchantId = pathMerchant || urlParams.get('merchant') || urlParams.get('foodypayId') || urlParams.get('uniqueId') || urlParams.get('id') || 'FP-445920';
    const rawTable = pathTable || urlParams.get('table') || urlParams.get('t') || 'Table 01';
    const storeName = urlParams.get('name') || urlParams.get('store') || 'Snack Rack';

    // Normalize table
    let currentTable = rawTable.toLowerCase().startsWith('table') ? rawTable : `Table ${rawTable}`;

    // App state
    let allProducts = [];
    let allCats = [];
    let activeCat = 'All';
    let searchQuery = '';
    let cart = new Map();
    let gstRate = 5;
    let appBannerTimer = null;
    let deferredPrompt = null;

    // Set Header Info
    document.getElementById('hdrStoreName').textContent = storeName;
    document.getElementById('hdrTableBadge').textContent = currentTable;
    document.getElementById('appDlName').textContent = `${storeName} App`;
    document.title = `${storeName} · ${currentTable} Menu`;

    // 10-Second App Download Reappear Rule
    function checkAppInstallStatus() {
      const isInstalled = localStorage.getItem('fp_app_installed') === 'true' || window.matchMedia('(display-mode: standalone)').matches;
      if (isInstalled) {
        const b = document.getElementById('appDownloadBanner');
        if (b) b.style.display = 'none';
      }
    }

    function dismissAppBanner() {
      const b = document.getElementById('appDownloadBanner');
      if (!b) return;
      b.classList.add('hiding');
      setTimeout(() => { b.style.display = 'none'; }, 300);

      // Reappear after 10 seconds if user has not downloaded/installed
      if (appBannerTimer) clearTimeout(appBannerTimer);
      appBannerTimer = setTimeout(() => {
        const isInstalled = localStorage.getItem('fp_app_installed') === 'true' || window.matchMedia('(display-mode: standalone)').matches;
        if (!isInstalled && b) {
          b.style.display = 'flex';
          void b.offsetWidth;
          b.classList.remove('hiding');
        }
      }, 10000);
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function handleAppInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            localStorage.setItem('fp_app_installed', 'true');
            const b = document.getElementById('appDownloadBanner');
            if (b) b.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        localStorage.setItem('fp_app_installed', 'true');
        const b = document.getElementById('appDownloadBanner');
        if (b) b.style.display = 'none';
        alert('App Installed to Home Screen!');
      }
    }

    // Call Waiter Alert
    async function callWaiterAlert() {
      alert(`🔔 Waiter called for ${currentTable}! Staff has been notified.`);
      const apiBase = getApiBase();
      try {
        await fetch(`${apiBase}/orders/public/claim`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ foodypayId: merchantId, table: currentTable, message: `Guest at ${currentTable} requested assistance` })
        });
      } catch(e) {}
    }

    // API Base URL Detection
    function getApiBase() {
      if (window.location.protocol === 'file:') return 'https://api.foodypay.online/api';
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return window.location.port === '3000' ? 'http://localhost:3000/api' : 'https://api.foodypay.online/api';
      }
      return `${window.location.origin}/api`;
    }

    // Load Menu from API
    async function loadMenu() {
      const apiBase = getApiBase();
      try {
        const res = await fetch(`${apiBase}/crm/public-menu?foodypayId=${encodeURIComponent(merchantId)}`);
        const json = await res.json();
        if (json.success && json.data) {
          allProducts = json.data.products || [];
          allCats = json.data.categories || [];
          gstRate = Number(json.data.gstPercent !== undefined ? json.data.gstPercent : 5);
          renderCategories();
          renderDishes();
        } else {
          fallbackMenu();
        }
      } catch (e) {
        console.warn('API error, using fallback:', e);
        fallbackMenu();
      }
    }

    function fallbackMenu() {
      allCats = ['Soups', 'Shakes & Beverages', 'Noodles', 'Momos', 'Fried Rice', 'Cold Drinks'];
      allProducts = [
        { id: 'p1', name: 'Lung Fung Soup', cat: 'Soups', diet: 'veg', vars: [{ n: 'Veg', p: 80 }, { n: 'Non-Veg', p: 100 }], img: 'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=500' },
        { id: 'p2', name: 'Manchow Soup', cat: 'Soups', diet: 'veg', vars: [{ n: 'Veg', p: 80 }, { n: 'Non-Veg', p: 100 }], img: 'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=500' },
        { id: 'p3', name: 'Cold Coffee', cat: 'Shakes & Beverages', diet: 'veg', vars: [{ n: 'Regular', p: 120 }], img: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=500' },
        { id: 'p4', name: 'Chocolate Shake', cat: 'Shakes & Beverages', diet: 'veg', vars: [{ n: 'Regular', p: 120 }], img: 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=500' },
        { id: 'p5', name: 'Veg Hakka Noodles', cat: 'Noodles', diet: 'veg', vars: [{ n: 'Half', p: 80 }, { n: 'Full', p: 140 }], img: 'https://images.unsplash.com/photo-1612927601601-6638404737ce?w=500' },
        { id: 'p6', name: 'Steam Veg Momos', cat: 'Momos', diet: 'veg', vars: [{ n: '6 pcs', p: 90 }, { n: '10 pcs', p: 140 }], img: 'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?w=500' }
      ];
      renderCategories();
      renderDishes();
    }

    function renderCategories() {
      const box = document.getElementById('catScroll');
      box.innerHTML = `<button class="cat-chip ${activeCat==='All'?'active':''}" onclick="filterCat('All')">All Items (${allProducts.length})</button>` +
        allCats.map(c => `
          <button class="cat-chip ${activeCat===c?'active':''}" onclick="filterCat('${c.replace(/'/g, "\\'")}')">${c}</button>
        `).join('');
    }

    function filterCat(c) {
      activeCat = c;
      renderCategories();
      renderDishes();
    }

    function handleSearch(q) {
      searchQuery = (q || '').toLowerCase().trim();
      renderDishes();
    }

    function renderDishes() {
      const box = document.getElementById('dishesGrid');
      let filtered = allProducts.filter(p => {
        const matchesCat = (activeCat === 'All') || (p.cat === activeCat);
        const matchesQ = !searchQuery || (p.name + ' ' + p.cat).toLowerCase().includes(searchQuery);
        return matchesCat && matchesQ;
      });

      if (!filtered.length) {
        box.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">Koi dish nahi mili.</div>';
        return;
      }

      box.innerHTML = filtered.map(p => {
        const isVeg = p.diet ? (p.diet === 'veg' || p.diet === 'both') : true;
        const imgUrl = (p.img && p.img.trim()) ? p.img : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500';
        const vars = (p.vars && p.vars.length) ? p.vars : [{ n: 'Regular', p: p.price || 0 }];

        return `
          <div class="dish-card">
            <div class="dish-card-img-wrap">
              <img src="${imgUrl}" alt="${p.name}" class="dish-card-img" loading="lazy">
              <span class="diet-dot ${isVeg ? 'veg' : 'nonveg'}"></span>
            </div>
            <div class="dish-body">
              <div class="dish-title">${p.name}</div>
              <div class="dish-cat-name">${p.cat || 'Special'}</div>
              <div class="dish-variants">
                ${vars.map(v => {
                  const cartKey = `${p.id}_${v.n}`;
                  const currentQty = cart.has(cartKey) ? cart.get(cartKey).qty : 0;
                  return `
                    <div class="var-row">
                      <div>
                        <span class="var-name">${v.n}</span>
                        <span class="var-price">₹${v.p}</span>
                      </div>
                      ${currentQty > 0 ? `
                        <div class="qty-counter">
                          <button class="btn-qty" onclick="changeQty('${p.id}', '${v.n}', ${v.p}, -1)">−</button>
                          <span class="qty-val">${currentQty}</span>
                          <button class="btn-qty" onclick="changeQty('${p.id}', '${v.n}', ${v.p}, 1)">+</button>
                        </div>
                      ` : `
                        <button class="btn-add-var" onclick="changeQty('${p.id}', '${v.n}', ${v.p}, 1)">+</button>
                      `}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeQty(prodId, varName, price, delta) {
      const cartKey = `${prodId}_${varName}`;
      const prod = allProducts.find(x => x.id == prodId) || { id: prodId, name: 'Dish', cat: '' };
      
      let item = cart.get(cartKey);
      if (!item && delta > 0) {
        item = { product: prod, varName, price: Number(price), qty: 0 };
        cart.set(cartKey, item);
      }
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart.delete(cartKey);
      }
      renderDishes();
      updateCartBar();
    }

    function updateCartBar() {
      let totalItems = 0;
      let totalAmount = 0;
      cart.forEach(item => {
        totalItems += item.qty;
        totalAmount += item.price * item.qty;
      });

      const bar = document.getElementById('bottomCartBar');
      if (totalItems > 0) {
        bar.classList.add('on');
        document.getElementById('cartTableBadge').textContent = `${currentTable.toUpperCase()} · ${totalItems} ITEMS`;
        document.getElementById('cartTotalText').textContent = `₹${totalAmount.toFixed(0)}`;
      } else {
        bar.classList.remove('on');
      }
    }

    function openCheckoutModal() {
      if (!cart.size) return;
      document.getElementById('reviewTableHeading').textContent = `${currentTable.toUpperCase()}`;
      
      const listEl = document.getElementById('cartItemsList');
      let subtotal = 0;
      let html = '';

      cart.forEach(({ product, varName, price, qty }) => {
        const itemTot = price * qty;
        subtotal += itemTot;
        html += `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">
            <div>
              <b style="font-size:13px;color:#fff">${product.name}</b>
              <small style="color:var(--text-muted);display:block;font-size:11px">${varName} · ₹${price} × ${qty}</small>
            </div>
            <b style="font-size:13px;color:#fb923c">₹${itemTot}</b>
          </div>
        `;
      });

      const gst = +(subtotal * (gstRate / 100)).toFixed(2);
      const grandTotal = subtotal + gst;

      listEl.innerHTML = html;
      document.getElementById('reviewTotalAmount').textContent = `₹${grandTotal.toFixed(0)}`;
      document.getElementById('checkoutModal').classList.add('on');
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModal').classList.remove('on');
    }

    async function submitCustomerOrder() {
      if (!cart.size) return;
      const btn = document.getElementById('btnSubmitOrder');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ Sending order to kitchen...</span>';

      const items = [];
      let subtotal = 0;
      cart.forEach(({ product, varName, price, qty }) => {
        subtotal += price * qty;
        items.push({
          pid: product.id || '',
          name: product.name,
          v: varName,
          qty: Number(qty),
          price: Number(price),
          isVeg: product.diet ? (product.diet === 'veg' || product.diet === 'both') : true
        });
      });

      const gst = +(subtotal * (gstRate / 100)).toFixed(2);
      const total = subtotal + gst;
      const custName = document.getElementById('custName').value.trim() || 'Walk-in Guest';
      const note = document.getElementById('orderNote').value.trim();

      const payload = {
        foodypayId: merchantId,
        table: currentTable,
        type: 'Dine-In',
        customer: custName,
        phone: '',
        note: note,
        items: items,
        subtotal: subtotal,
        discount: 0,
        tax: gst,
        total: total,
        paymentMode: 'Cash',
        paymentStatus: 'unpaid',
        paymentLabel: 'Cash on Table / Counter',
        placedBy: 'Customer',
        printKot: true
      };

      const apiBase = getApiBase();
      try {
        const res = await fetch(`${apiBase}/orders/public`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert(`🎉 Order Placed Successfully for ${currentTable}!\nOrder #${data.data?.orderId || 'NEW'} sent to Kitchen.`);
          cart.clear();
          updateCartBar();
          closeCheckoutModal();
          renderDishes();
        } else {
          alert(`❌ Order failed: ${data.message || 'Please retry'}`);
        }
      } catch (err) {
        alert(`❌ Network error: ${err.message}. Please check connection.`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Send Order to Kitchen</span>';
      }
    }

    // Bootstrap
    checkAppInstallStatus();
    loadMenu();
  </script>
</body>
</html>
