<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FoodyPay Waiter Order Terminal</title>
  <link rel="icon" type="image/x-icon" href="Logo.ico">
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="apple-touch-icon" href="Logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --pri: #ea580c;
      --pri-dark: #c2410c;
      --pri-light: #fff4ed;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --veg: #22c55e;
      --nonveg: #ef4444;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #090d16;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(75px + var(--safe-bottom));
      user-select: none;
    }

    /* APP DOWNLOAD BANNER (10-SEC REAPPEAR RULE) */
    .app-download-bar {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-bottom: 1.5px solid rgba(234, 88, 12, 0.4);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 60;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .app-download-bar.hiding {
      transform: translateY(-100%);
      opacity: 0;
    }
    .app-dl-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .app-dl-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #94a3b8;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .app-dl-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .app-dl-title {
      font-size: 12.5px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-dl-tag {
      background: #ea580c;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .app-dl-desc {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-app-install {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(234,88,12,0.4);
    }

    /* TOP HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .brand-info {
      min-width: 0;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .waiter-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      color: #fb923c;
    }

    /* ACTIVE TABLE PILL */
    .btn-table-picker {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      color: #fff;
      border: none;
      border-radius: 99px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);
      flex-shrink: 0;
    }

    /* SEARCH & CATEGORY BAR */
    .nav-bar {
      position: sticky;
      top: 53px;
      z-index: 40;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
    }
    .search-input-wrap {
      position: relative;
      margin-bottom: 8px;
    }
    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px 8px 34px;
      color: #fff;
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
    }
    .cat-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-chip {
      flex-shrink: 0;
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cat-chip.active {
      background: #ea580c;
      border-color: #ea580c;
      color: #fff;
    }

    /* DISHES GRID */
    .catalog-container {
      padding: 12px;
      flex: 1;
    }
    .dishes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    @media(min-width: 600px) {
      .dishes-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    }
    .dish-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .dish-card:active {
      transform: scale(0.98);
    }
    .dish-card-img-wrap {
      height: 110px;
      width: 100%;
      background: #090d16;
      position: relative;
      overflow: hidden;
    }
    .dish-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .diet-dot {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .diet-dot.veg::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
    }
    .diet-dot.nonveg::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dc2626;
    }
    .dish-body {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .dish-title {
      font-size: 13.5px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.25;
    }
    .dish-cat-name {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .dish-variants {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: auto;
    }
    .var-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .var-name {
      font-size: 11.5px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .var-price {
      font-size: 12px;
      font-weight: 800;
      color: #fb923c;
    }
    .btn-add-var {
      background: #ea580c;
      color: #fff;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .qty-counter {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-qty {
      background: #334155;
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .qty-val {
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      min-width: 14px;
      text-align: center;
    }

    /* BOTTOM CART BAR */
    .bottom-cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 10px 14px calc(10px + var(--safe-bottom));
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    .bottom-cart-bar.on {
      display: flex;
    }
    .cart-summary {
      display: flex;
      flex-direction: column;
    }
    .cart-tbl-badge {
      font-size: 11px;
      font-weight: 800;
      color: #ea580c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cart-total-text {
      font-size: 18px;
      font-weight: 900;
      color: #fff;
    }
    .btn-punch-kot {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.4);
    }

    /* MODALS */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.on {
      display: flex;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      color: #fff;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
    }
    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    /* TABLE GRID SELECTOR */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 8px;
      overflow-y: auto;
      max-height: 50vh;
      padding: 4px;
    }
    .table-card {
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .table-card.active {
      border-color: #ea580c;
      background: rgba(234, 88, 12, 0.2);
    }
    .table-card b {
      display: block;
      font-size: 13px;
      color: #fff;
    }
    .table-card small {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* PIN LOCK MODAL */
    .pin-display {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }
    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #64748b;
    }
    .pin-dot.filled {
      background: #ea580c;
      border-color: #ea580c;
    }
    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 280px;
      margin: 0 auto;
    }
    .pin-btn {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      height: 52px;
      border-radius: 12px;
      cursor: pointer;
    }
    .pin-btn:active {
      background: #ea580c;
    }
  </style>
</head>
<body>

  <!-- APP DOWNLOAD BANNER (10-SEC DISMISS REAPPEAR TIMER) -->
  <div class="app-download-bar" id="appDownloadBanner">
    <div class="app-dl-left">
      <button class="app-dl-close" onclick="dismissAppBanner()" title="Close banner" aria-label="Dismiss">✕</button>
      <img src="Logo.png" alt="App Logo" class="app-dl-logo" onerror="this.src='https://api.foodypay.online/Logo.png'">
      <div style="min-width:0">
        <div class="app-dl-title" id="appDlTitle">
          <span id="appDlName">Waiter Terminal App</span>
          <span class="app-dl-tag">WAITER</span>
        </div>
        <div class="app-dl-desc">Take table orders, print KOT &amp; live sync</div>
      </div>
    </div>
    <button class="btn-app-install" onclick="handleAppInstall()">Install App</button>
  </div>

  <!-- HEADER -->
  <header>
    <div class="brand-wrap">
      <img src="Logo.png" alt="FoodyPay" class="brand-logo" onerror="this.src='https://api.foodypay.online/Logo.png'">
      <div class="brand-info">
        <div class="brand-name" id="hdrStoreName">Snack Rack</div>
        <div class="waiter-tag">
          <span>🤵</span>
          <span id="hdrWaiterName">Kartik</span>
        </div>
      </div>
    </div>

    <!-- Active Table Selector Button -->
    <button class="btn-table-picker" onclick="openTableModal()">
      <span>Table:</span>
      <b id="hdrActiveTable">Table 01</b>
      <span>▾</span>
    </button>
  </header>

  <!-- SEARCH & CATEGORY BAR -->
  <div class="nav-bar">
    <div class="search-input-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="menuSearch" class="search-input" placeholder="Search dishes, soup, momos, shake..." oninput="handleSearch(this.value)">
    </div>
    <div class="cat-scroll" id="catScroll">
      <button class="cat-chip active" onclick="filterCat('All')">All Items</button>
    </div>
  </div>

  <!-- DISHES GRID -->
  <div class="catalog-container">
    <div class="dishes-grid" id="dishesGrid">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">
        ⏳ Loading digital menu...
      </div>
    </div>
  </div>

  <!-- BOTTOM STICKY CART BAR -->
  <div class="bottom-cart-bar" id="bottomCartBar">
    <div class="cart-summary" onclick="openOrderReviewModal()">
      <div class="cart-tbl-badge" id="cartTableBadge">TABLE 01 · 0 ITEMS</div>
      <div class="cart-total-text" id="cartTotalText">₹0</div>
    </div>
    <button class="btn-punch-kot" onclick="openOrderReviewModal()">
      <span>🔥 Punch KOT</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- TABLE SELECTOR MODAL -->
  <div class="modal-overlay" id="tableModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Select Table for Order</h3>
        <button class="btn-close" onclick="closeTableModal()">✕</button>
      </div>
      <div class="tables-grid" id="tablesGrid"></div>
    </div>
  </div>

  <!-- ORDER REVIEW & KOT PUNCH MODAL -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Review KOT Order</h3>
        <button class="btn-close" onclick="closeOrderReviewModal()">✕</button>
      </div>
      <div style="font-size:12px;color:#fb923c;font-weight:800;margin-bottom:10px" id="reviewTableHeading">TABLE 01 · STEWARD: KARTIK</div>
      
      <div style="flex:1;overflow-y:auto;max-height:40vh;margin-bottom:12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 0" id="cartItemsList"></div>

      <div style="margin-bottom:10px">
        <label style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px">Kitchen Note (Optional):</label>
        <input id="kotNote" placeholder="e.g. Less spicy, Extra ketchup..." style="width:100%;padding:8px 10px;background:#0f172a;border:1px solid var(--border);border-radius:8px;color:#fff;font-size:12px;outline:none">
      </div>

      <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:900;margin-bottom:14px">
        <span>Grand Total (Inc. GST):</span>
        <span style="color:#22c55e" id="reviewTotalAmount">₹0</span>
      </div>

      <button id="btnSubmitKot" onclick="submitKotOrder()" style="width:100%;background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;padding:12px;border-radius:12px;font-size:14.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">
        <span>Send KOT to Kitchen</span>
      </button>
    </div>
  </div>

  <!-- PIN LOCK MODAL -->
  <div class="modal-overlay" id="pinModal">
    <div class="modal-box" style="text-align:center">
      <div style="font-size:36px;margin-bottom:6px">🔒</div>
      <h3 style="font-size:18px;font-weight:800;margin-bottom:4px">Waiter Terminal Security</h3>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Enter 4-digit PIN for <b id="pinWaiterLabel">Waiter</b></p>
      
      <div class="pin-display">
        <div class="pin-dot" id="dot0"></div>
        <div class="pin-dot" id="dot1"></div>
        <div class="pin-dot" id="dot2"></div>
        <div class="pin-dot" id="dot3"></div>
      </div>

      <div class="pin-pad">
        <button class="pin-btn" onclick="pressPin('1')">1</button>
        <button class="pin-btn" onclick="pressPin('2')">2</button>
        <button class="pin-btn" onclick="pressPin('3')">3</button>
        <button class="pin-btn" onclick="pressPin('4')">4</button>
        <button class="pin-btn" onclick="pressPin('5')">5</button>
        <button class="pin-btn" onclick="pressPin('6')">6</button>
        <button class="pin-btn" onclick="pressPin('7')">7</button>
        <button class="pin-btn" onclick="pressPin('8')">8</button>
        <button class="pin-btn" onclick="pressPin('9')">9</button>
        <button class="pin-btn" onclick="clearPin()" style="font-size:13px;color:#ef4444">CLR</button>
        <button class="pin-btn" onclick="pressPin('0')">0</button>
        <button class="pin-btn" onclick="submitPin()" style="font-size:13px;color:#22c55e">OK</button>
      </div>
      <div id="pinMsg" style="margin-top:10px;font-size:12px;font-weight:700;color:#ef4444;min-height:16px"></div>
    </div>
  </div>

  <script>
    // URL Params Parser
    const urlParams = new URLSearchParams(window.location.search);
    const merchantId = urlParams.get('merchant') || urlParams.get('foodypayId') || urlParams.get('uniqueId') || 'FP-445920';
    const waiterIdParam = urlParams.get('waiter') || urlParams.get('waiterId') || 'waiter-kartik';
    const storeNameParam = urlParams.get('name') || urlParams.get('store') || 'Snack Rack';
    const defaultTableParam = urlParams.get('table') || 'Table 01';

    // State
    let currentTable = defaultTableParam;
    let waiterId = waiterIdParam;
    let waiterName = waiterId.replace(/^waiter[-_]?/i, '').replace(/([A-Z])/g, ' $1').trim() || 'Steward';
    waiterName = waiterName.charAt(0).toUpperCase() + waiterName.slice(1);
    let allProducts = [];
    let allCats = [];
    let allTables = [];
    let activeCat = 'All';
    let searchQuery = '';
    let cart = new Map(); // key: prodId_varName -> { product, varName, price, qty }
    let gstRate = 5;
    let pinInputVal = '';
    let appBannerTimer = null;
    let deferredPrompt = null;

    // 10-Second App Download Reappear Rule
    function checkAppInstallStatus() {
      const isInstalled = localStorage.getItem('fp_waiter_app_installed') === 'true' || window.matchMedia('(display-mode: standalone)').matches;
      if (isInstalled) {
        const b = document.getElementById('appDownloadBanner');
        if (b) b.style.display = 'none';
      }
    }

    function dismissAppBanner() {
      const b = document.getElementById('appDownloadBanner');
      if (!b) return;
      b.classList.add('hiding');
      setTimeout(() => { b.style.display = 'none'; }, 300);

      // Reappear after 10 seconds if user has not downloaded/installed
      if (appBannerTimer) clearTimeout(appBannerTimer);
      appBannerTimer = setTimeout(() => {
        const isInstalled = localStorage.getItem('fp_waiter_app_installed') === 'true' || window.matchMedia('(display-mode: standalone)').matches;
        if (!isInstalled && b) {
          b.style.display = 'flex';
          void b.offsetWidth;
          b.classList.remove('hiding');
        }
      }, 10000);
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function handleAppInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            localStorage.setItem('fp_waiter_app_installed', 'true');
            const b = document.getElementById('appDownloadBanner');
            if (b) b.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        localStorage.setItem('fp_waiter_app_installed', 'true');
        const b = document.getElementById('appDownloadBanner');
        if (b) b.style.display = 'none';
        alert('Waiter App Installed to Home Screen!');
      }
    }

    // API Base URL - Intelligent detection
    function getApiBase() {
      if (window.location.protocol === 'file:') return 'https://api.foodypay.online/api';
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return window.location.port === '3000' ? 'http://localhost:3000/api' : 'https://api.foodypay.online/api';
      }
      return `${window.location.origin}/api`;
    }

    // Init UI Headings
    document.getElementById('hdrStoreName').textContent = storeNameParam;
    document.getElementById('hdrWaiterName').textContent = waiterName;
    document.getElementById('hdrActiveTable').textContent = currentTable;
    document.getElementById('pinWaiterLabel').textContent = `${waiterName} (${waiterId})`;

    // Check PIN Authentication
    function checkPinAuth() {
      const savedAuth = localStorage.getItem(`fp_waiter_auth_${waiterId}`);
      if (!savedAuth) {
        document.getElementById('pinModal').classList.add('on');
      }
    }

    function pressPin(n) {
      if (pinInputVal.length < 4) {
        pinInputVal += n;
        updatePinDots();
        if (pinInputVal.length === 4) {
          setTimeout(submitPin, 150);
        }
      }
    }
    function clearPin() {
      pinInputVal = '';
      updatePinDots();
      document.getElementById('pinMsg').textContent = '';
    }
    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById(`dot${i}`).classList.toggle('filled', i < pinInputVal.length);
      }
    }
    function submitPin() {
      if (pinInputVal.length < 4) {
        document.getElementById('pinMsg').textContent = 'Please enter 4 digits';
        return;
      }
      // Verified PIN locally or standard
      localStorage.setItem(`fp_waiter_auth_${waiterId}`, 'true');
      document.getElementById('pinModal').classList.remove('on');
      clearPin();
    }

    // Load Menu from API / Cloud
    async function loadCatalog() {
      const apiBase = getApiBase();
      try {
        const res = await fetch(`${apiBase}/crm/public-menu?foodypayId=${encodeURIComponent(merchantId)}`);
        const json = await res.json();
        if (json.success && json.data) {
          const d = json.data;
          allProducts = d.products || [];
          allCats = d.categories || [];
          gstRate = Number(d.gstPercent !== undefined ? d.gstPercent : 5);
          
          // Generate tables list
          allTables = [];
          if (Array.isArray(d.areas) && d.areas.length) {
            d.areas.forEach(a => {
              (a.tables || []).forEach(t => allTables.push(t.name || t));
            });
          }
          if (!allTables.length) {
            for (let i = 1; i <= 20; i++) allTables.push(`Table ${i < 10 ? '0' + i : i}`);
          }

          renderCategories();
          renderDishes();
          renderTables();
        } else {
          fallbackLocalCatalog();
        }
      } catch (err) {
        console.warn('API fetch notice, using fallback:', err);
        fallbackLocalCatalog();
      }
    }

    function fallbackLocalCatalog() {
      allCats = ['Soups', 'Shakes & Beverages', 'Noodles', 'Momos', 'Fried Rice', 'Cold Drinks'];
      allTables = ['Table 01', 'Table 02', 'Table 03', 'Table 04', 'Table 05', 'Table 06', 'Table 07', 'Table 08'];
      allProducts = [
        { id: 'p1', name: 'Lung Fung Soup', cat: 'Soups', diet: 'veg', vars: [{ n: 'Veg', p: 80 }, { n: 'Non-Veg', p: 100 }], img: 'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=500' },
        { id: 'p2', name: 'Manchow Soup', cat: 'Soups', diet: 'veg', vars: [{ n: 'Veg', p: 80 }, { n: 'Non-Veg', p: 100 }], img: 'https://images.unsplash.com/photo-1547592166-23ac45744acd?w=500' },
        { id: 'p3', name: 'Cold Coffee', cat: 'Shakes & Beverages', diet: 'veg', vars: [{ n: 'Regular', p: 120 }], img: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=500' },
        { id: 'p4', name: 'Chocolate Shake', cat: 'Shakes & Beverages', diet: 'veg', vars: [{ n: 'Regular', p: 120 }], img: 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=500' },
        { id: 'p5', name: 'Veg Hakka Noodles', cat: 'Noodles', diet: 'veg', vars: [{ n: 'Half', p: 80 }, { n: 'Full', p: 140 }], img: 'https://images.unsplash.com/photo-1612927601601-6638404737ce?w=500' },
        { id: 'p6', name: 'Steam Veg Momos', cat: 'Momos', diet: 'veg', vars: [{ n: '6 pcs', p: 90 }, { n: '10 pcs', p: 140 }], img: 'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?w=500' }
      ];
      renderCategories();
      renderDishes();
      renderTables();
    }

    function renderCategories() {
      const box = document.getElementById('catScroll');
      box.innerHTML = `<button class="cat-chip ${activeCat==='All'?'active':''}" onclick="filterCat('All')">All Items (${allProducts.length})</button>` +
        allCats.map(c => `
          <button class="cat-chip ${activeCat===c?'active':''}" onclick="filterCat('${c.replace(/'/g, "\\'")}')">${c}</button>
        `).join('');
    }

    function filterCat(c) {
      activeCat = c;
      renderCategories();
      renderDishes();
    }

    function handleSearch(q) {
      searchQuery = (q || '').toLowerCase().trim();
      renderDishes();
    }

    function renderDishes() {
      const box = document.getElementById('dishesGrid');
      let filtered = allProducts.filter(p => {
        const matchesCat = (activeCat === 'All') || (p.cat === activeCat);
        const matchesQ = !searchQuery || (p.name + ' ' + p.cat).toLowerCase().includes(searchQuery);
        return matchesCat && matchesQ;
      });

      if (!filtered.length) {
        box.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">Koi dish nahi mili.</div>';
        return;
      }

      box.innerHTML = filtered.map(p => {
        const isVeg = p.diet ? (p.diet === 'veg' || p.diet === 'both') : true;
        const imgUrl = (p.img && p.img.trim()) ? p.img : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500';
        const vars = (p.vars && p.vars.length) ? p.vars : [{ n: 'Regular', p: p.price || 0 }];

        return `
          <div class="dish-card">
            <div class="dish-card-img-wrap">
              <img src="${imgUrl}" alt="${p.name}" class="dish-card-img" loading="lazy">
              <span class="diet-dot ${isVeg ? 'veg' : 'nonveg'}"></span>
            </div>
            <div class="dish-body">
              <div class="dish-title">${p.name}</div>
              <div class="dish-cat-name">${p.cat || 'Special'}</div>
              <div class="dish-variants">
                ${vars.map(v => {
                  const cartKey = `${p.id}_${v.n}`;
                  const currentQty = cart.has(cartKey) ? cart.get(cartKey).qty : 0;
                  return `
                    <div class="var-row">
                      <div>
                        <span class="var-name">${v.n}</span>
                        <span class="var-price">₹${v.p}</span>
                      </div>
                      ${currentQty > 0 ? `
                        <div class="qty-counter">
                          <button class="btn-qty" onclick="changeQty('${p.id}', '${v.n}', ${v.p}, -1)">−</button>
                          <span class="qty-val">${currentQty}</span>
                          <button class="btn-qty" onclick="changeQty('${p.id}', '${v.n}', ${v.p}, 1)">+</button>
                        </div>
                      ` : `
                        <button class="btn-add-var" onclick="changeQty('${p.id}', '${v.n}', ${v.p}, 1)">+</button>
                      `}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Cart Handlers
    function changeQty(prodId, varName, price, delta) {
      const cartKey = `${prodId}_${varName}`;
      const prod = allProducts.find(x => x.id == prodId) || { id: prodId, name: 'Dish', cat: '' };
      
      let item = cart.get(cartKey);
      if (!item && delta > 0) {
        item = { product: prod, varName, price: Number(price), qty: 0 };
        cart.set(cartKey, item);
      }
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart.delete(cartKey);
      }
      renderDishes();
      updateCartBar();
    }

    function updateCartBar() {
      let totalItems = 0;
      let totalAmount = 0;
      cart.forEach(item => {
        totalItems += item.qty;
        totalAmount += item.price * item.qty;
      });

      const bar = document.getElementById('bottomCartBar');
      if (totalItems > 0) {
        bar.classList.add('on');
        document.getElementById('cartTableBadge').textContent = `${currentTable.toUpperCase()} · ${totalItems} ITEMS`;
        document.getElementById('cartTotalText').textContent = `₹${totalAmount.toFixed(0)}`;
      } else {
        bar.classList.remove('on');
      }
    }

    // Table Selector
    function openTableModal() {
      document.getElementById('tableModal').classList.add('on');
    }
    function closeTableModal() {
      document.getElementById('tableModal').classList.remove('on');
    }
    function renderTables() {
      const grid = document.getElementById('tablesGrid');
      grid.innerHTML = allTables.map(t => `
        <div class="table-card ${t === currentTable ? 'active' : ''}" onclick="selectActiveTable('${t}')">
          <b>${t}</b>
          <small>${t === currentTable ? 'Active' : 'Pick'}</small>
        </div>
      `).join('');
    }
    function selectActiveTable(t) {
      currentTable = t;
      document.getElementById('hdrActiveTable').textContent = currentTable;
      renderTables();
      closeTableModal();
      updateCartBar();
    }

    // Order Review Modal & KOT Submission
    function openOrderReviewModal() {
      if (!cart.size) return;
      document.getElementById('reviewTableHeading').textContent = `${currentTable.toUpperCase()} · STEWARD: ${waiterName.toUpperCase()}`;
      
      const listEl = document.getElementById('cartItemsList');
      let subtotal = 0;
      let html = '';

      cart.forEach(({ product, varName, price, qty }) => {
        const itemTot = price * qty;
        subtotal += itemTot;
        html += `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0">
            <div>
              <b style="font-size:13px;color:#fff">${product.name}</b>
              <small style="color:var(--text-muted);display:block;font-size:11px">${varName} · ₹${price} × ${qty}</small>
            </div>
            <b style="font-size:13px;color:#fb923c">₹${itemTot}</b>
          </div>
        `;
      });

      const gst = +(subtotal * (gstRate / 100)).toFixed(2);
      const grandTotal = subtotal + gst;

      listEl.innerHTML = html;
      document.getElementById('reviewTotalAmount').textContent = `₹${grandTotal.toFixed(0)}`;
      document.getElementById('orderModal').classList.add('on');
    }
    function closeOrderReviewModal() {
      document.getElementById('orderModal').classList.remove('on');
    }

    async function submitKotOrder() {
      if (!cart.size) return;
      const btn = document.getElementById('btnSubmitKot');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳ Sending to Kitchen KOT...</span>';

      const items = [];
      let subtotal = 0;
      cart.forEach(({ product, varName, price, qty }) => {
        subtotal += price * qty;
        items.push({
          pid: product.id || '',
          name: product.name,
          v: varName,
          qty: Number(qty),
          price: Number(price),
          isVeg: product.diet ? (product.diet === 'veg' || product.diet === 'both') : true
        });
      });

      const gst = +(subtotal * (gstRate / 100)).toFixed(2);
      const total = subtotal + gst;
      const note = document.getElementById('kotNote').value.trim();

      const payload = {
        foodypayId: merchantId,
        table: currentTable,
        type: 'Dine-In',
        customer: `Diner (Served by ${waiterName})`,
        phone: '',
        note: note,
        items: items,
        subtotal: subtotal,
        discount: 0,
        tax: gst,
        total: total,
        paymentMode: 'Cash',
        paymentStatus: 'unpaid',
        paymentLabel: 'Cash / Steward',
        waiterId: waiterId,
        waiterName: waiterName,
        placedBy: 'Waiter',
        printKot: true
      };

      const apiBase = getApiBase();
      try {
        const res = await fetch(`${apiBase}/orders/public`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert(`✅ KOT Punched Successfully for ${currentTable}!\nOrder #${data.data?.orderId || 'NEW'} sent to Kitchen.`);
          cart.clear();
          updateCartBar();
          closeOrderReviewModal();
          renderDishes();
        } else {
          alert(`❌ Order failed: ${data.message || 'Please retry'}`);
        }
      } catch (err) {
        alert(`❌ Network error: ${err.message}. Please check connection.`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Send KOT to Kitchen</span>';
      }
    }

    // Bootstrap
    checkAppInstallStatus();
    checkPinAuth();
    loadCatalog();
  </script>
</body>
</html>
